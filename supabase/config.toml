project_id = "fyxyqxpscmqjyjxsyhms"

# ---------------------------------------------------------------- functions
#
# Sprint 32. This file used to carry only `project_id`, which meant the
# `verify_jwt` posture of every function was a property of how someone last
# ran `supabase functions deploy` rather than something reviewable in the
# repo.
#
# These values were read back off the deployed project, not chosen. The first
# draft of this file asserted `verify_jwt = false` everywhere, which was wrong
# for ten of the twelve — writing it would have *loosened* the gateway check on
# them, which is the exact opposite of the point of this sprint. Stating a
# posture is only useful if it is the real one.
#
# What `verify_jwt` does and does not buy here: it makes the platform gateway
# require a JWT before the function runs. The publishable key satisfies it, and
# the publishable key is public by design — which is why cron's
# `Authorization: Bearer sb_publishable_…` passes it today, and why it is not
# an access control on its own. The real gates are in the function bodies:
#
#   - Class A (cron-only) checks `x-cron-secret` via _shared/cron-auth.ts,
#     against a Vault secret read with the function's own service role (no
#     CRON_SECRET env var — the value never leaves Postgres).
#   - Class B and the fpl-* pair call `verifyUser` (_shared/auth.ts), which
#     validates the JWT's signature against Supabase Auth rather than trusting
#     it, and lets the function distinguish "signed out" (401) from "over your
#     rate limit" (429) — a distinction the UI surfaces.

# --- Class A: cron-only. Reject anything without the cron secret. -----------
[functions.sync-bootstrap]
verify_jwt = true

[functions.sync-fixtures]
verify_jwt = true

[functions.sync-player-history]
verify_jwt = true

[functions.sync-live-gameweek]
verify_jwt = true

# sync-news and generate-predictions were the two deployed with the gateway
# check off. Sprint 32 left them as found and recorded the gap as a decision
# someone should make deliberately; DSI-59 made it, on measurement rather than
# tidiness. Probed live 2026-09-10:
#
#   verify_jwt = true,  no auth header -> 401 at the gateway, function never runs
#   verify_jwt = false, no auth header -> function runs, then cron-auth 401s
#   either setting, publishable key    -> function runs, then cron-auth 401s
#
# So the posture buys NO access control. The publishable key is public by
# design, so anyone can satisfy the gateway and land at the same cron-secret
# check either way. The one real difference is that `false` spends an
# invocation before rejecting — which is a cost argument, not a security one,
# and worth stating in those terms rather than calling it hardening.
#
# Flipped for that reason and for consistency: all ten cron functions now share
# one posture. It changes nothing about who can call them.
#
# NOTE: this file is what `supabase functions deploy` applies. Changing it here
# without redeploying leaves the repo claiming a posture the project does not
# have, which is the exact failure Sprint 32 wrote this file to prevent.
[functions.sync-news]
verify_jwt = true

[functions.sync-claimed-managers]
verify_jwt = true

[functions.generate-predictions]
verify_jwt = true

[functions.ingest-fpl-archive]
verify_jwt = true

[functions.notify]
verify_jwt = true

# --- Class B: browser-invoked. verifyUser + per-user rate limit. ------------
[functions.sync-manager]
verify_jwt = true

[functions.sync-league-picks]
verify_jwt = true

# --- Superseded but deliberately still deployed (CLAUDE.md). ---------------
# Both have always called verifyUser; confirmed in Sprint 32 rather than
# assumed, since they are the two that touch per-user data.
[functions.fpl-session]
verify_jwt = true

[functions.fpl-my-team]
verify_jwt = true

# --- Class C: called by Telegram. Sprint 36. -------------------------------
#
# A third caller class, and the first function here that legitimately runs
# without a JWT — Telegram has none to send, so the gateway check must be off
# or every delivery 401s before the function is reached. It is now the ONLY
# `false` in this file, and it is false on purpose: the two Class A functions
# that used to share the value were false by inheritance, and DSI-59 flipped
# them once it was measured rather than assumed.
#
# What gates it instead: the `setWebhook` secret token, arriving as
# `X-Telegram-Bot-Api-Secret-Token` and compared by digest inside Postgres, and
# then a chat-id allowlist before any squad data is read. Both in
# _shared/telegram.ts.
[functions.telegram-webhook]
verify_jwt = false

