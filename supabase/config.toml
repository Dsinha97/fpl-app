project_id = "fyxyqxpscmqjyjxsyhms"

# ---------------------------------------------------------------- functions
#
# Sprint 32. This file used to carry only `project_id`, which meant the
# `verify_jwt` posture of every function was a property of how someone last
# ran `supabase functions deploy` rather than something reviewable in the
# repo. Stated explicitly here so a change to it shows up in a diff.
#
# `verify_jwt = false` is NOT "unauthenticated" for any function below — it
# means the platform gateway does not do the checking, because the function
# does it itself and can return a useful error instead of an opaque gateway
# 401:
#
#   - Class A (cron-only) checks `x-cron-secret` via _shared/cron-auth.ts,
#     against a Vault secret read with the function's own service role (no
#     CRON_SECRET env var — the value never leaves Postgres). The gateway's
#     JWT check would not help: the publishable key satisfies it, and the
#     publishable key is public by design.
#   - Class B and the fpl-* pair call `verifyUser` (_shared/auth.ts), which
#     validates the JWT's signature against Supabase Auth rather than
#     trusting it, and lets the function distinguish "signed out" (401) from
#     "over your rate limit" (429) — a distinction the UI surfaces.

# --- Class A: cron-only. Reject anything without the cron secret. -----------
[functions.sync-bootstrap]
verify_jwt = false

[functions.sync-fixtures]
verify_jwt = false

[functions.sync-player-history]
verify_jwt = false

[functions.sync-live-gameweek]
verify_jwt = false

[functions.sync-news]
verify_jwt = false

[functions.sync-claimed-managers]
verify_jwt = false

[functions.generate-predictions]
verify_jwt = false

[functions.ingest-fpl-archive]
verify_jwt = false

# --- Class B: browser-invoked. verifyUser + per-user rate limit. ------------
[functions.sync-manager]
verify_jwt = false

[functions.sync-league-picks]
verify_jwt = false

# --- Superseded but deliberately still deployed (CLAUDE.md). ---------------
# Both have always called verifyUser; confirmed in Sprint 32 rather than
# assumed, since they are the two that touch per-user data.
[functions.fpl-session]
verify_jwt = false

[functions.fpl-my-team]
verify_jwt = false
