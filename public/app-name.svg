<!-- Light Mode Logo -->
<svg width="260" height="60" viewBox="0 0 260 60" fill="none" xmlns="http://www.w3.org/2000/svg" class="block dark:hidden">
  <rect width="48" height="48" x="6" y="6" rx="12" fill="#3B0764"/>
  <!-- FD Monogram: Backwards F + D sharing vertical stem at x=28 -->
  <g stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shared Vertical Line -->
    <line x1="28" y1="18" x2="28" y2="42" stroke="#FFFFFF"/>
    <!-- Backwards F (pointing left) -->
    <path d="M28 18H18 M28 29H20" stroke="#00FF87"/>
    <!-- Letter D (pointing right) -->
    <path d="M28 18H33C37.5 18 40 21.5 40 30C40 38.5 37.5 42 33 42H28" stroke="#00FF87"/>
  </g>
  <!-- Accent Dot -->
  <circle cx="20" cy="40" r="2.5" fill="#EF4444"/>
  
  <text x="66" y="34" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#3B0764" letter-spacing="-0.5">FPL <tspan fill="#7E22CE">DECISION</tspan></text>
  <text x="66" y="46" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#6B21A8" letter-spacing="1.5">ANALYTICS HUB</text>
</svg>

<!-- Dark Mode Logo -->
<svg width="260" height="60" viewBox="0 0 260 60" fill="none" xmlns="http://www.w3.org/2000/svg" class="hidden dark:block">
  <rect width="48" height="48" x="6" y="6" rx="12" fill="#1E0234" stroke="#581C87" stroke-width="1.5"/>
  <!-- FD Monogram -->
  <g stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shared Vertical Line -->
    <line x1="28" y1="18" x2="28" y2="42" stroke="#FFFFFF"/>
    <!-- Backwards F -->
    <path d="M28 18H18 M28 29H20" stroke="#00FF87"/>
    <!-- Letter D -->
    <path d="M28 18H33C37.5 18 40 21.5 40 30C40 38.5 37.5 42 33 42H28" stroke="#00FF87"/>
  </g>
  <!-- Accent Dot -->
  <circle cx="20" cy="40" r="2.5" fill="#EF4444"/>

  <text x="66" y="34" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="-0.5">FPL <tspan fill="#00FF87">DECISION</tspan></text>
  <text x="66" y="46" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#A855F7" letter-spacing="1.5">ANALYTICS HUB</text>
</svg>
